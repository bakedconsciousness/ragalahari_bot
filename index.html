<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragalahari Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .display {
            margin-bottom: 20px;
        }

        #result {
            width: 100%;
            padding: 20px;
            font-size: 32px;
            text-align: right;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #f5f5f5;
            color: #333;
            font-weight: 600;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #f5f5f5;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.operator {
            background: #667eea;
            color: white;
        }

        .btn.operator:hover {
            background: #5568d3;
        }

        .btn.equals {
            grid-column: span 4;
            background: #764ba2;
            color: white;
            font-size: 24px;
        }

        .btn.equals:hover {
            background: #5f3a82;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        @media (max-width: 480px) {
            .calculator {
                padding: 20px;
            }

            .btn {
                padding: 15px;
                font-size: 18px;
            }

            #result {
                font-size: 24px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <h1>Ragalahari Calculator</h1>
            <div class="display">
                <input type="text" id="result" readonly value="0">
            </div>
            <div class="buttons">
                <button class="btn operator" onclick="clearDisplay()">C</button>
                <button class="btn operator" onclick="deleteLast()">←</button>
                <button class="btn operator" onclick="appendToDisplay('%')">%</button>
                <button class="btn operator" onclick="appendToDisplay('/')">÷</button>

                <button class="btn" onclick="appendToDisplay('7')">7</button>
                <button class="btn" onclick="appendToDisplay('8')">8</button>
                <button class="btn" onclick="appendToDisplay('9')">9</button>
                <button class="btn operator" onclick="appendToDisplay('*')">×</button>

                <button class="btn" onclick="appendToDisplay('4')">4</button>
                <button class="btn" onclick="appendToDisplay('5')">5</button>
                <button class="btn" onclick="appendToDisplay('6')">6</button>
                <button class="btn operator" onclick="appendToDisplay('-')">-</button>

                <button class="btn" onclick="appendToDisplay('1')">1</button>
                <button class="btn" onclick="appendToDisplay('2')">2</button>
                <button class="btn" onclick="appendToDisplay('3')">3</button>
                <button class="btn operator" onclick="appendToDisplay('+')">+</button>

                <button class="btn" onclick="appendToDisplay('0')">0</button>
                <button class="btn" onclick="appendToDisplay('.')">.</button>
                <button class="btn" onclick="appendToDisplay('(')">(</button>
                <button class="btn" onclick="appendToDisplay(')')">)</button>

                <button class="btn equals" onclick="calculate()">=</button>
            </div>
            <div id="error" class="error"></div>
        </div>
    </div>

    <script>
        let display = document.getElementById('result');
        let errorDiv = document.getElementById('error');

        function appendToDisplay(value) {
            errorDiv.textContent = '';
            if (display.value === '0') {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = '0';
            errorDiv.textContent = '';
        }

        function deleteLast() {
            errorDiv.textContent = '';
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = '0';
            }
        }

        function calculate() {
            errorDiv.textContent = '';
            try {
                const expression = display.value;

                // Basic security: only allow specific characters
                const allowed = /^[0-9+\-*/.()% ]+$/;
                if (!allowed.test(expression)) {
                    throw new Error('Invalid characters');
                }

                // Evaluate the expression safely
                const result = Function('"use strict"; return (' + expression + ')')();

                if (!isFinite(result)) {
                    throw new Error('Invalid calculation');
                }

                display.value = result;
            } catch (error) {
                errorDiv.textContent = 'Error: Invalid expression';
                setTimeout(() => {
                    errorDiv.textContent = '';
                }, 3000);
            }
        }

        // Allow keyboard input
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key >= '0' && key <= '9') {
                appendToDisplay(key);
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendToDisplay(key);
            } else if (key === '.' || key === '(' || key === ')') {
                appendToDisplay(key);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Backspace') {
                event.preventDefault();
                deleteLast();
            } else if (key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>
</html>
